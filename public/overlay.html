<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #E31C25;
            --accent: #FF2D35;
            --glow: #FF3333;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: transparent;
            overflow: hidden;
            user-select: none;
        }
        
        #ares-overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        
        /* ARES NEURAL BUTTON - Animated Avatar */
        .ares-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(227, 28, 37, 0.4);
            z-index: 100;
        }

        .ares-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(227, 28, 37, 0.6);
        }

        .core-inner {
            width: 25px;
            height: 25px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--glow);
            transition: all 0.3s ease;
        }

        .core-ring {
            position: absolute;
            border: 1px solid var(--primary);
            border-radius: 50%;
            opacity: 0.4;
            pointer-events: none;
        }

        .ring-1 { width: 45px; height: 45px; animation: coreRotate 4s linear infinite; }
        .ring-2 { width: 60px; height: 60px; animation: coreRotate 6s linear infinite reverse; border-style: dashed; }

        @keyframes coreRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* States */
        .ares-btn.listening .core-inner { background: #00ff66; box-shadow: 0 0 20px #00ff66; animation: corePulse 0.5s ease-in-out infinite alternate; }
        .ares-btn.thinking .core-inner { animation: coreThinking 1s linear infinite; }
        .ares-btn.speaking .core-inner { animation: corePulse 0.2s ease-in-out infinite alternate; }

        @keyframes corePulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        @keyframes coreThinking {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(0.9); }
        }
        
        /* Menu */
        .ares-menu {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(227, 28, 37, 0.5);
            border-radius: 16px;
            padding: 10px;
            min-width: 190px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(227, 28, 37, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: menuIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .ares-menu.show {
            display: flex;
        }
        
        @keyframes menuIn {
            from { 
                opacity: 0; 
                transform: translateY(10px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(227, 28, 37, 0.1);
            border: 1px solid transparent;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .menu-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .menu-item:hover {
            background: rgba(227, 28, 37, 0.25);
            border-color: rgba(227, 28, 37, 0.5);
            transform: translateX(5px);
        }
        
        .menu-item:hover::before {
            opacity: 1;
        }
        
        .menu-item.active {
            background: rgba(0, 255, 0, 0.15);
            border-color: rgba(0, 255, 0, 0.5);
        }
        
        .menu-item.active::before {
            background: #00ff00;
            opacity: 1;
        }
        
        .menu-item .icon {
            font-size: 1.2rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .menu-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(227, 28, 37, 0.4), transparent);
            margin: 4px 8px;
        }
        
        /* Chat Popup - Glassmorphism */
        #chat-popup {
            display: none;
            position: absolute;
            bottom: 85px;
            right: 0;
            width: 340px;
            height: 420px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(227, 28, 37, 0.5);
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(227, 28, 37, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            flex-direction: column;
            overflow: hidden;
            animation: popupIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        #chat-popup.show {
            display: flex;
        }
        
        @keyframes popupIn {
            from { 
                opacity: 0; 
                transform: translateY(20px) scale(0.9); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 4px 15px rgba(227, 28, 37, 0.4);
        }
        
        .popup-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .popup-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .popup-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
        }
        
        .popup-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
        }
        
        .popup-message {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: msgIn 0.3s ease;
        }
        
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .popup-message.user {
            flex-direction: row-reverse;
            align-self: flex-end;
        }
        
        .popup-message .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        
        .popup-message.ares .avatar {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            animation: avatarPulse 2s ease-in-out infinite;
        }
        
        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(227, 28, 37, 0.5); }
            50% { box-shadow: 0 0 20px rgba(227, 28, 37, 0.8); }
        }
        
        .popup-message.user .avatar {
            background: #333;
            border: 2px solid var(--primary);
        }
        
        .popup-message .content {
            background: rgba(227, 28, 37, 0.2);
            border: 1px solid rgba(227, 28, 37, 0.3);
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 0.88rem;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .popup-message.user .content {
            background: rgba(50, 50, 50, 0.9);
            border-color: rgba(227, 28, 37, 0.4);
        }
        
        /* Typing Indicator */
        .popup-message.typing {
            animation: none;
        }
        
        .popup-message.typing .content {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typingDot 1.4s ease-in-out infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        
        .popup-input-area {
            display: flex;
            gap: 8px;
            padding: 14px;
            border-top: 1px solid rgba(227, 28, 37, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }
        
        .popup-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(227, 28, 37, 0.4);
            border-radius: 25px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }
        
        .popup-input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(227, 28, 37, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .popup-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .popup-input-area button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(227, 28, 37, 0.4);
        }
        
        .popup-input-area button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(227, 28, 37, 0.6);
        }
        
        .popup-voice-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(227, 28, 37, 0.2);
            border: 2px solid var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .popup-voice-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }
        
        .popup-voice-btn.recording {
            background: #00ff00;
            border-color: #00ff00;
            animation: voiceRecording 1s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
        }
        
        @keyframes voiceRecording {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.8); }
        }
    </style>
</head>
<body>
    <div id="ares-overlay">
        <div id="chat-popup">
            <div class="popup-header">
                <h3>🔴 Ares</h3>
                <button class="popup-close" onclick="toggleChat()">✕</button>
            </div>
            <div class="popup-messages" id="popup-messages">
                <div class="popup-message ares">
                    <div class="avatar">🔴</div>
                    <div class="content">Salve. Estoy aquí. ¿En qué puedo ayudarte?</div>
                </div>
            </div>
            <div class="popup-input-area">
                <button class="popup-voice-btn" id="popup-voice" title="Mantener para hablar">🎤</button>
                <input type="text" id="popup-input" placeholder="Escribe o habla..." autocomplete="off">
                <button onclick="sendPopupMessage()">➤</button>
            </div>
        </div>
        
        <div class="ares-menu" id="ares-menu">
            <div class="menu-item" onclick="toggleChat()">
                <span class="icon">💬</span>
                <span>Chat</span>
            </div>
            <div class="menu-divider"></div>
            <div class="menu-item" id="menu-camera" onclick="toggleCamera()">
                <span class="icon">📷</span>
                <span>Cámara</span>
            </div>
            <div class="menu-item" id="menu-screen" onclick="toggleScreen()">
                <span class="icon">🖥️</span>
                <span>Pantalla</span>
            </div>
            <div class="menu-item" id="menu-both" onclick="toggleBoth()">
                <span class="icon">📺</span>
                <span>Video + Pantalla</span>
            </div>
            <div class="menu-divider"></div>
            <div class="menu-item" onclick="toggleOverlay()">
                <span class="icon">❌</span>
                <span>Cerrar</span>
            </div>
        </div>
        
        <button class="ares-btn" id="ares-btn" onclick="toggleMenu()" title="Click: Menu | Double Click: Chat">
            <div class="core-ring ring-1"></div>
            <div class="core-ring ring-2"></div>
            <div class="core-inner"></div>
        </button>
    </div>
    
    <script>
        const API_KEY = ""; // REEMPLAZAR CON TU KEY
        
        let isMenuOpen = false;
        let isChatOpen = false;
        let recognition = null;
        let isListening = false;
        let cameraStream = null;
        let screenStream = null;
        
        const btn = document.getElementById('ares-btn');
        
        function initOverlay() {
            makeDraggable(document.getElementById('ares-btn'));
            
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'es-ES';
                
                recognition.onstart = () => {
                    setBtnState('listening');
                };
                
                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    if (event.results[event.resultIndex].isFinal) {
                        if (transcript.toLowerCase().includes('ares') || transcript.toLowerCase().includes('árbol')) {
                            wakeUpAres();
                        }
                    }
                };
                
                recognition.onend = () => {
                    if (isListening) {
                        recognition.start();
                    } else {
                        setBtnState('idle');
                    }
                };
            }
            
            setupPopupVoice();
            startWakeDetection();
        }
        
        function setBtnState(state) {
            btn.classList.remove('listening', 'thinking', 'speaking', 'active');
            if (state === 'listening') btn.classList.add('listening');
            else if (state === 'thinking') btn.classList.add('thinking');
            else if (state === 'speaking') btn.classList.add('speaking');
            else if (state === 'active') btn.classList.add('active');
        }
        
        function startWakeDetection() {
            isListening = true;
            setBtnState('listening');
            if (recognition) {
                try { recognition.start(); } catch(e) {}
            }
        }
        
        function wakeUpAres() {
            speak('¿Sí? Estoy aquí.');
            setTimeout(() => {
                setBtnState('idle');
                toggleChat();
            }, 1200);
        }
        
        function speak(text) {
            setBtnState('speaking');
            if ('speechSynthesis' in window) {
                const synth = window.speechSynthesis;
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1;
                utterance.onend = () => setBtnState('idle');
                synth.speak(utterance);
            }
        }
        
        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            const menu = document.getElementById('ares-menu');
            menu.classList.toggle('show', isMenuOpen);
            setBtnState(isMenuOpen ? 'active' : 'idle');
            
            if (isMenuOpen) {
                isChatOpen = false;
                document.getElementById('chat-popup').classList.remove('show');
            }
        }
        
        function toggleChat() {
            isChatOpen = !isChatOpen;
            isMenuOpen = false;
            document.getElementById('ares-menu').classList.remove('show');
            document.getElementById('chat-popup').classList.toggle('show', isChatOpen);
            setBtnState(isChatOpen ? 'active' : 'idle');
        }
        
        function toggleCamera() {
            const menuItem = document.getElementById('menu-camera');
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
                menuItem.classList.remove('active');
            } else {
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                    .then(stream => {
                        cameraStream = stream;
                        menuItem.classList.add('active');
                    })
                    .catch(e => alert('Error: ' + e.message));
            }
            isMenuOpen = false;
            document.getElementById('ares-menu').classList.remove('show');
            setBtnState('idle');
        }
        
        function toggleScreen() {
            const menuItem = document.getElementById('menu-screen');
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
                menuItem.classList.remove('active');
            } else {
                navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                    .then(stream => {
                        screenStream = stream;
                        menuItem.classList.add('active');
                        stream.getVideoTracks()[0].onended = () => toggleScreen();
                    })
                    .catch(e => alert('Error: ' + e.message));
            }
            isMenuOpen = false;
            document.getElementById('ares-menu').classList.remove('show');
            setBtnState('idle');
        }
        
        function toggleBoth() {
            toggleCamera();
            setTimeout(toggleScreen, 500);
        }
        
        function setupPopupVoice() {
            const voiceBtn = document.getElementById('popup-voice');
            if (!voiceBtn) return;
            
            let popupRecognition = null;
            
            voiceBtn.addEventListener('mousedown', () => {
                popupRecognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                popupRecognition.lang = 'es-ES';
                popupRecognition.interimResults = true;
                
                popupRecognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    if (event.results[event.resultIndex].isFinal) {
                        document.getElementById('popup-input').value = transcript;
                        sendPopupMessage();
                    }
                };
                
                popupRecognition.start();
                voiceBtn.classList.add('recording');
                setBtnState('listening');
            });
            
            voiceBtn.addEventListener('mouseup', () => {
                if (popupRecognition) popupRecognition.stop();
                voiceBtn.classList.remove('recording');
                setBtnState('idle');
            });
        }
        
        async function sendPopupMessage() {
            const input = document.getElementById('popup-input');
            const message = input.value.trim();
            if (!message) return;
            
            addPopupMessage('user', message);
            input.value = '';
            setBtnState('thinking');
            
            showTyping();
            
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: 'Eres Ares, assistente conciso. Máx 2 oraciones.' },
                            { role: 'user', content: message }
                        ]
                    })
                });
                
                const data = await response.json();
                const answer = data.choices?.[0]?.message?.content || 'Entendido.';
                removeTyping();
                addPopupMessage('ares', answer);
                setBtnState('speaking');
                speak(answer);
            } catch (e) {
                removeTyping();
                addPopupMessage('ares', 'Entendido. ¿Algo más?');
                setBtnState('idle');
            }
        }
        
        function addPopupMessage(type, content) {
            const container = document.getElementById('popup-messages');
            const div = document.createElement('div');
            div.className = `popup-message ${type}`;
            div.innerHTML = `<div class="avatar">${type === 'ares' ? '🔴' : '👤'}</div><div class="content">${content}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function showTyping() {
            const container = document.getElementById('popup-messages');
            const div = document.createElement('div');
            div.id = 'popup-typing';
            div.className = 'popup-message typing ares';
            div.innerHTML = `<div class="avatar">🔴</div><div class="content"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function removeTyping() {
            document.getElementById('popup-typing')?.remove();
        }
        
        function toggleOverlay() {
            document.getElementById('ares-overlay').style.display = 'none';
            window.parent.postMessage({ type: 'overlay-closed' }, '*');
        }
        
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = dragMouseDown;
            
            function dragMouseDown(e) {
                e = e || window.event;
                if (e.target !== element) return; // Only drag if clicking the core itself
                
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            
            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                const overlay = document.getElementById('ares-overlay');
                overlay.style.bottom = (parseInt(window.getComputedStyle(overlay).bottom) + pos2) + "px";
                overlay.style.right = (parseInt(window.getComputedStyle(overlay).right) + pos1) + "px";
            }
            
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }
        
        // Double click to toggle chat
        btn.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            toggleChat();
        });
        
        document.getElementById('popup-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendPopupMessage();
        });
        
        initOverlay();
        window.parent.postMessage({ type: 'overlay-ready' }, '*');
    </script>
</body>
</html>
